[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifein"
version = "0.0.1"
description = "自托管的个人生活 agent"
requires-python = ">=3.11"

# 依赖的选型理由见 docs/04-tech-decisions.md ADR-016 与 ADR-017。
# 加任何一行之前先补 ADR —— 见 AGENTS.md §3。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "cryptography>=44",
    "qrcode>=8.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["lifein*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 需要真实 PostgreSQL 的用例。没设 TEST_DATABASE_URL 时自动跳过,
# 所以日常 pytest 不需要装数据库。见 tests/conftest.py
markers = ["integration: 需要真实 PostgreSQL"]
